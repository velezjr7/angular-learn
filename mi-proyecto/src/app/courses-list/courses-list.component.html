<h2>{{ title }}</h2>

@if (wishlist.length > 0) {
  <span class="wishlist-banner"
    >❤️ My Wishlist:
    @for (course of wishlist; track course.title) {
      <span class="wishlist-item">{{ course.title }}</span>
    }
  </span>
}

@for (course of courses; track course.id) {
  <app-course-card
    [course]="course"
    (courseBooked)="onCourseBooked($event)"
    (addToWishlist)="onAddToWishlist($event)"
  ></app-course-card>
}
